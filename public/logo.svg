<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#000"/>
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="40%" style="stop-color:#a0a0a0"/>
      <stop offset="70%" style="stop-color:#c8c8c8"/>
      <stop offset="100%" style="stop-color:#707070"/>
    </linearGradient>
    <linearGradient id="metal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d0d0d0"/>
      <stop offset="50%" style="stop-color:#888"/>
      <stop offset="100%" style="stop-color:#bbb"/>
    </linearGradient>
  </defs>
  <!-- Staff/Rod -->
  <rect x="97" y="60" width="6" height="110" rx="3" fill="url(#metal)"/>
  <!-- Snake 1 - left wrap -->
  <path d="M100,75 C85,80 80,90 90,100 C100,110 95,120 80,125 C70,128 72,138 85,142 C95,145 100,152 100,160"
    stroke="url(#metal2)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Snake 2 - right wrap -->
  <path d="M100,75 C115,80 120,90 110,100 C100,110 105,120 120,125 C130,128 128,138 115,142 C105,145 100,152 100,160"
    stroke="url(#metal)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Snake heads -->
  <ellipse cx="91" cy="72" rx="6" ry="4" fill="url(#metal2)" transform="rotate(-20,91,72)"/>
  <ellipse cx="109" cy="72" rx="6" ry="4" fill="url(#metal)" transform="rotate(20,109,72)"/>
  <!-- Tongues -->
  <path d="M88,70 L84,67 M88,70 L85,73" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M112,70 L116,67 M112,70 L115,73" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Orb at top of staff -->
  <circle cx="100" cy="62" r="7" fill="url(#metal)"/>
  <!-- Left wing -->
  <path d="M97,65 C85,60 65,52 42,38 C55,48 68,55 80,62 C70,58 50,48 30,32 C45,46 62,56 78,63 C65,62 45,55 25,42 C42,56 60,63 78,65 C65,67 45,63 28,55 C44,65 62,70 80,68"
    fill="url(#metal2)" opacity="0.9"/>
  <!-- Right wing -->
  <path d="M103,65 C115,60 135,52 158,38 C145,48 132,55 120,62 C130,58 150,48 170,32 C155,46 138,56 122,63 C135,62 155,55 175,42 C158,56 140,63 122,65 C135,67 155,63 172,55 C156,65 138,70 120,68"
    fill="url(#metal)" opacity="0.9"/>
  <!-- Wing feather details left -->
  <path d="M75,63 C65,57 50,50 35,40" stroke="#777" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M73,66 C61,61 46,55 30,47" stroke="#777" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- Wing feather details right -->
  <path d="M125,63 C135,57 150,50 165,40" stroke="#999" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M127,66 C139,61 154,55 170,47" stroke="#999" stroke-width="1" fill="none" opacity="0.6"/>
</svg>
